<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src http://127.0.0.1:*; object-src 'none'; base-uri 'none'">
  <title>Agent Flow</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">◈</span> <span class="brand-name">Agent Flow</span></div>
    <div class="toolbar-actions">
      <button id="folder-button" title="Choose workspace · Ctrl+O" aria-label="Choose workspace"><span class="button-icon" aria-hidden="true">▱</span><span class="button-label" id="folder-text">Choose folder</span></button>
      <button id="pin-button" aria-pressed="true" title="Keep above other windows · Ctrl+Shift+T" aria-label="Always on top"><span class="button-icon" aria-hidden="true">⌖</span><span class="button-label" id="pin-text">Always on top</span></button>
      <button id="dock-button" aria-pressed="false" title="Dock to the screen edge · Ctrl+Shift+← / →" aria-label="Dock to screen edge"><span class="button-icon" id="dock-icon" aria-hidden="true">▐</span><span class="button-label" id="dock-text">Dock</span></button>
      <button id="orb-button" disabled title="Float as an orb on the desktop · Ctrl+Shift+O" aria-label="Float as an orb"><span class="button-icon" aria-hidden="true">◉</span><span class="button-label">Orb</span></button>
      <button id="widget-button" aria-pressed="true" title="Switch widget / full view · Ctrl+Shift+W" aria-label="Expand to full view"><span id="widget-icon" aria-hidden="true">⤢</span><span class="button-label" id="widget-text">Full view</span></button>
      <button id="minimize-button" class="window-button" title="Minimize" aria-label="Minimize">−</button>
      <button id="close-button" class="window-button" title="Close" aria-label="Close">×</button>
    </div>
  </header>
  <div class="workspace-bar"><select id="source-mode" aria-label="Agent source"><option value="auto">Local</option><option value="t3">T3 teams</option><option value="t3-all">All T3 projects</option></select><span id="connection-dot" class="dot"></span><span id="workspace-label">No workspace selected</span><span id="connection-label">READY</span></div>
  <div id="error" role="alert" hidden></div>
  <main>
    <section id="welcome">
      <div class="welcome-orbit" aria-hidden="true"><span>◈</span></div>
      <h1>Open a workspace</h1>
      <p>Choose a project folder to watch Claude Code and Codex sessions as they work.</p>
      <button id="welcome-choose" class="primary">Choose workspace folder <span>↗</span></button>
      <button id="open-all-t3" title="Watch teams from every T3 project. No folder needed.">Watch all T3 projects</button>
      <button id="open-last" hidden>Open last workspace</button>
      <div id="last-folder" class="last-folder"></div>
    </section>
    <iframe id="graph" title="Agent Flow workspace graph" sandbox="allow-scripts allow-same-origin allow-downloads" hidden></iframe>
  </main>
  <footer><span id="footer-status">LOCAL WORKSPACE VIEWER</span><span>Ctrl+O <span class="muted">folder</span> &nbsp; / &nbsp; Ctrl+Shift+T <span class="muted">pin</span></span></footer>
  <div id="resize-grip" title="Drag to resize widget" aria-hidden="true"></div>
  <script src="shell.js"></script>
</body>
</html>
